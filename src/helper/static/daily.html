<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>曲库有序 · 每日推荐</title><script src="/static/appearance.js?v=2.0.6"></script><link rel="stylesheet" href="/static/product.css?v=2.0.6"><link rel="stylesheet" href="/static/design-system.css?v=2.0.7"><script defer src="/static/auth.js?v=2.0.6"></script><script defer src="/static/daily.js?v=2.0.6"></script><script defer src="/static/refined.js?v=2.0.6"></script></head><body data-view="daily" data-auth-state="checking">
<div id="bootScreen" class="auth-boot"><div class="boot-mark">♫</div><strong>曲库有序</strong><span>正在进入你的音乐库…</span></div>
<section id="authShell" class="auth-shell" hidden>
 <div class="auth-card">
  <div class="auth-brand"><span class="brand-mark">♫</span><div><strong>曲库有序</strong><small>本地 Plex 音乐助手</small></div></div>
  <div id="loginPanel"><span class="eyebrow">WELCOME BACK</span><h1>登录</h1><form id="loginForm" class="auth-form"><label>用户名<input id="loginUser" autocomplete="username" value="admin" required></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form></div>
  <div id="setupPanel" hidden><span class="eyebrow">FIRST SETUP</span><h1>创建管理员账户</h1><form id="setupForm" class="auth-form"><label>用户名<input id="setupUser" autocomplete="username" value="admin" required></label><label>新密码<input id="setupPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>确认密码<input id="setupConfirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary" type="submit">建立账户并进入</button></form></div>
  <p id="authMessage" class="auth-message" hidden></p>
 </div>
</section>
<div id="workspace" hidden>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">♫</span><span>曲库有序</span></a><nav><a href="/">我的歌单</a><a href="/status">运行状态</a><a href="/settings">设置</a></nav><button class="logout" data-auth-logout hidden>退出</button></header>
<main class="wrap"><div id="notice" class="notice" hidden></div>
<section class="hero daily-page-head"><div class="daily-heading"><h1>今日推荐</h1><span id="activeProfileLabel" class="muted"></span></div></section>
<section id="setupPrompt" class="card setup-card" hidden><span class="eyebrow">首次设置 · FIRST SETUP</span><h2>先连接 Plex 音乐库</h2><p class="muted"></p><a class="primary link" href="/settings#accounts">去完成设置</a></section>
<div id="dailyArea">
<section hidden class="flow-strip" aria-label="手动推荐流程"><div class="flow-step" id="flowGenerate"><span>1</span><div><strong>生成</strong><small>只生成预览</small></div></div><div class="flow-line"></div><div class="flow-step" id="flowPreview"><span>2</span><div><strong>预览</strong><small>检查歌单</small></div></div><div class="flow-line"></div><div class="flow-step" id="flowPublish"><span>3</span><div><strong>发布</strong><small>更新每日推荐</small></div></div></section>
<section id="repairCard" class="card repair-card" hidden><div class="panel-title"><div><span class="eyebrow">SAFE REPAIR</span><h2>上次发布没有收尾</h2></div><span class="bucket warn">需要确认</span></div><p id="repairText" class="muted"></p><button id="repairDaily" class="primary">安全修复</button></section>
<article id="dailyPlaylist" class="card daily-main-card">
 <div class="panel-title daily-playlist-head"><h2 id="dailyTitle">今日歌单</h2><span id="dailyState" class="bucket">待生成</span></div>
 <section class="daily-controls"><div class="button-row daily-inline-actions"><button id="generate" class="primary wide">生成今日歌单</button><button id="fullRefresh" class="secondary" hidden>换一批</button><button id="publish" class="primary wide" hidden disabled>发布到 Plexamp</button></div><div id="dailyFeedback" aria-live="polite"><span id="dailyJobFeedback"></span></div></section>
 <p id="dailyMessage" class="daily-message" hidden></p>
 <div id="dailyMeta" class="daily-meta" role="group" aria-label="歌单信息" hidden></div><div id="warnings"></div>
 <div class="song-tools" hidden><div class="summary-line" id="bucketSummary"></div><button id="showReasons" class="reason-toggle secondary" type="button" aria-pressed="false">推荐原因</button></div>
 <div id="songs" class="song-list"></div><div id="emptySongs" class="empty">点击“生成今日歌单”开始</div>
 <div class="daily-compat-values" hidden><strong id="targetCount">—</strong><span id="actualCount">0</span><span id="favoriteCount">0</span><span id="avoidDays">—</span></div>
</article>
</div></main></div></body></html>
