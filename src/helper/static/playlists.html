<!doctype html>
<html class="playlist-shell" lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="app-version" content="2.0.6">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>曲库有序 · 我的歌单</title>
 <script src="/static/appearance.js?v=app"></script><link rel="stylesheet" href="/static/product.css?v=app"><link rel="stylesheet" href="/static/playlist-now-playing.css?v=app"><link rel="stylesheet" href="/static/theme-tokens.css?v=app"><link rel="stylesheet" href="/static/theme-background.css?v=app"><link rel="stylesheet" href="/static/ui-components.css?v=app"><link rel="stylesheet" href="/static/design-system.css?v=app">
 <script defer src="/static/auth.js?v=app"></script>
 <script type="module" src="/static/playlists.js?v=app"></script>
</head>
<body data-view="playlists" data-auth-state="checking">
<svg class="player-icon-defs" aria-hidden="true" focusable="false">
 <defs>
  <symbol id="icon-mode-shuffle" viewBox="0 0 24 24"><path d="M4 7h2.6c4.8 0 5.7 10 10.8 10H20M17 4l3 3-3 3M4 17h2.6c1.7 0 2.9-1.2 4-2.9M14.1 9.9C15 8.2 16 7 17.4 7H20M17 14l3 3-3 3"/></symbol>
  <symbol id="icon-mode-sequential" viewBox="0 0 24 24"><path d="M5 6h11M5 12h11M5 18h11M18 15l3 3-3 3"/></symbol>
  <symbol id="icon-mode-single" viewBox="0 0 24 24"><path d="M7 6h9a4 4 0 0 1 4 4v1M17 3l3 3-3 3M17 18H8a4 4 0 0 1-4-4v-1M7 21l-3-3 3-3M12 9v6M10 10l2-1"/></symbol>
  <symbol id="icon-mode-list" viewBox="0 0 24 24"><path d="M7 6h9a4 4 0 0 1 4 4v1M17 3l3 3-3 3M17 18H8a4 4 0 0 1-4-4v-1M7 21l-3-3 3-3"/></symbol>
  <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M19 8a7 7 0 1 0 1 7M19 4v4h-4"/></symbol>
  <symbol id="icon-import-down" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></symbol>
  <symbol id="icon-expand-up" viewBox="0 0 24 24"><path d="m7 15 5-5 5 5M7 10l5-5 5 5"/></symbol>
 </defs>
</svg>
<div id="bootScreen" class="auth-boot"><div class="boot-mark">♫</div><strong>曲库有序</strong><span>正在进入你的音乐库…</span></div>
<section id="authShell" class="auth-shell" hidden>
 <div class="auth-card">
  <div class="auth-brand"><span class="brand-mark">♫</span><div><strong>曲库有序</strong><small>本地 Plex 音乐助手</small></div></div>
  <div id="loginPanel"><h1>登录</h1><form id="loginForm" class="auth-form"><label>用户名<input id="loginUser" autocomplete="username" value="admin" required></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form></div>
  <div id="setupPanel" hidden><h1>创建管理员账户</h1><form id="setupForm" class="auth-form"><label>用户名<input id="setupUser" autocomplete="username" value="admin" required></label><label>新密码<input id="setupPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>确认密码<input id="setupConfirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary" type="submit">建立账户并进入</button></form></div>
  <p id="authMessage" class="auth-message" hidden></p>
 </div>
</section>
<div id="workspace" hidden>
 <header class="topbar">
  <button id="playlistSidebarToggle" class="playlist-sidebar-toggle" type="button" aria-label="打开歌单导航" aria-controls="playlistSidebar" aria-expanded="false">☰</button>
  <button class="brand" id="workspaceHome" type="button"><span class="brand-mark">♫</span><span>曲库有序</span></button>
  <form id="librarySearchForm" class="playlist-global-search" role="search"><span class="playlist-search-icon" aria-hidden="true"></span><input id="librarySearchInput" type="search" placeholder="搜索音乐" autocomplete="off"><button type="submit">搜索</button></form>
  <nav><button type="button" data-workspace-url="/status">运行状态</button><button id="openSettings" type="button">设置</button></nav><button class="logout" data-auth-logout hidden>退出</button>
 </header>
 <main class="playlist-hub">
  <button id="playlistSidebarBackdrop" class="playlist-sidebar-backdrop" type="button" aria-label="关闭歌单导航" hidden></button>
  <aside id="playlistSidebar" class="playlist-sidebar">
   <div class="playlist-profile-block"><select id="playlistProfile" class="playlist-profile" aria-label="选择用户"></select></div>
   <nav class="playlist-fixed-nav" aria-label="歌单分类">
    <button id="smartHubButton" type="button" data-section="smart"><span class="playlist-fixed-icon" aria-hidden="true">✦</span><span>智能歌单</span></button>
    <button id="libraryHubButton" type="button" data-section="library"><span class="playlist-fixed-icon" aria-hidden="true">▦</span><span>曲库整理</span></button>
   </nav>
   <div class="playlist-list-scroll">
    <div class="playlist-side-heading"><h2>歌单</h2><span id="playlistHeadingActions" class="playlist-side-heading-actions"><button id="customPlaylistCreate" type="button" aria-label="新建歌单" title="新建歌单">＋</button><button id="importHubButton" type="button" data-tool-url="/external" aria-label="导入歌单" title="导入歌单"><svg class="ui-icon sidebar-control-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#icon-import-down"></use></svg></button><button id="customPlaylistRefresh" type="button" aria-label="刷新歌单" title="刷新歌单"><svg class="ui-icon sidebar-control-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#icon-refresh"></use></svg></button></span></div>
    <nav id="customPlaylistList" class="playlist-side-list" aria-label="歌单"></nav>
   </div>
   <div class="playlist-sidebar-footer"><button id="mobileSettings" type="button">设置</button></div>
  </aside>
  <section class="playlist-main">
   <div id="playlistNotice" class="notice" role="status" hidden></div>
   <section id="playlistSectionView" class="playlist-section-view">
    <header class="playlist-section-head"><h1><button id="playlistSectionTitle" class="playlist-section-title-link" type="button">智能歌单</button></h1></header>
    <div id="playlistSectionCards" class="playlist-section-cards"></div>
   </section>
   <section id="playlistView">
    <div id="playlistStickyHead" class="playlist-sticky-head">
     <header class="playlist-hero">
      <div class="playlist-hero-intro"><span id="playlistHeroArtwork" class="playlist-cover playlist-cover-hero is-placeholder" data-variant="hero" aria-hidden="true">♫</span><div><h1 id="playlistTitle">选择一个歌单</h1><p id="playlistSummary" class="muted">0 首歌曲</p></div></div>
      <div class="playlist-actions"><button id="playlistManage" class="secondary" type="button" hidden>管理</button><button id="playlistRename" class="secondary" type="button" hidden>重命名</button><button id="playlistRemove" class="danger" type="button" hidden>删除歌单</button><button id="playlistPlayAll" class="primary" type="button" disabled>▶ 播放全部</button></div>
     </header>
    </div>
    <div class="playlist-track-scroll">
     <div class="playlist-track-head"><span aria-hidden="true"></span><span>歌曲</span><span>歌手</span><span>专辑</span><span>时长</span><span aria-hidden="true"></span></div>
     <div id="playlistTracks" class="playlist-tracks"></div>
     <button id="playlistLoadMore" class="secondary playlist-load-more" type="button" hidden>加载更多歌曲</button>
     <div id="playlistEmpty" class="playlist-empty">还没有可显示的歌单</div>
    </div>
   </section>
   <section id="playlistSearchView" class="playlist-search-view" hidden>
    <header class="playlist-search-head"><div><h1 id="librarySearchTitle">搜索结果</h1><p id="librarySearchSummary" class="muted"></p></div></header>
    <div id="librarySearchResults" class="playlist-search-results"></div>
   </section>
   <section id="playlistToolView" hidden>
    <iframe id="playlistToolFrame" title="创建与整理" loading="eager"></iframe>
   </section>
  </section>
 </main>
 <dialog id="librarySearchDialog" class="playlist-search-dialog">
  <form method="dialog" class="playlist-dialog-head"><h2>添加到歌单</h2><button type="submit" aria-label="关闭">×</button></form>
  <div id="librarySearchSelected" class="playlist-search-selected"></div>
  <label class="playlist-search-target">选择歌单<select id="librarySearchTarget"></select></label>
  <div class="playlist-dialog-actions"><button id="librarySearchConfirm" class="primary" type="button">确认添加</button></div>
 </dialog>
 <dialog id="playlistRenameDialog" class="playlist-search-dialog playlist-rename-dialog">
  <form method="dialog" class="playlist-dialog-head"><h2>重命名歌单</h2><button type="submit" aria-label="关闭">×</button></form>
  <label class="playlist-rename-field">歌单名称<input id="playlistRenameInput" maxlength="80" autocomplete="off"></label>
  <div class="playlist-dialog-actions"><button id="playlistRenameConfirm" class="primary" type="button">确认重命名</button></div>
 </dialog>
 <dialog id="playlistCreateDialog" class="playlist-search-dialog playlist-rename-dialog">
  <form method="dialog" class="playlist-dialog-head"><h2>新建歌单</h2><button type="submit" aria-label="关闭">×</button></form>
  <p class="playlist-create-hint">将在当前 Plex 用户中创建空白普通歌单，可随后搜索歌曲并添加。</p>
  <label class="playlist-rename-field">歌单名称<input id="playlistCreateInput" maxlength="80" autocomplete="off" placeholder="给歌单起个名字"></label>
  <div class="playlist-dialog-actions"><button id="playlistCreateConfirm" class="primary" type="button">创建歌单</button></div>
 </dialog>
 <section id="nowPlaying" class="now-playing" aria-label="正在播放" tabindex="-1" hidden>
  <div class="now-playing-backdrop" aria-hidden="true"></div>
  <button id="nowPlayingClose" class="now-playing-close" type="button" aria-label="收起播放详情"><svg id="nowPlayingCloseIcon" class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="now-playing-stage">
   <div class="now-playing-record">
    <div id="nowPlayingArtwork" class="now-playing-artwork" aria-hidden="true">♫</div>
   </div>
   <div id="nowPlayingContent" class="now-playing-content">
    <div class="now-playing-copy"><h1 id="nowPlayingTitle">未播放</h1><p id="nowPlayingMeta">请选择歌曲</p></div>
    <div class="now-playing-lyrics-panel">
     <div id="nowPlayingLyrics" class="now-playing-lyrics" aria-label="歌词"></div>
     <p id="nowPlayingLyricsStatus" class="now-playing-lyrics-status">暂无歌词</p>
    </div>
   </div>
  </div>
  <canvas id="nowPlayingVisualizer" class="now-playing-visualizer" aria-hidden="true"></canvas>
 </section>
 <footer id="playlistPlayer" class="playlist-player" data-playing="false" data-muted="false">
  <div id="playlistProgressRail" class="playlist-progress-rail"><input id="playerSeek" type="range" min="0" max="1000" value="0" aria-label="播放进度"></div>
  <div class="playlist-player-body">
   <div id="playerFeedback" class="playlist-player-feedback" role="alert" hidden><span id="playerFeedbackMessage">这首歌暂时无法播放</span><button id="playerRetry" type="button">重试</button><button id="playerErrorNext" type="button">下一首</button></div>
   <div id="playerNow" class="playlist-now"><button id="playerDetail" class="player-detail" type="button" aria-label="展开当前歌曲播放详情"><span id="playerArtwork" class="playlist-artwork" aria-hidden="true">♫</span><span id="playerArtworkExpand" class="playlist-artwork-expand" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#icon-expand-up"></use></svg></span></button><div class="playlist-now-info"><strong id="playerTitle">未播放</strong><span id="playerArtist">请选择歌曲</span><button id="playerLiked" class="playlist-heart" type="button" aria-label="喜欢" aria-pressed="false" title="喜欢">♡</button></div></div>
   <div class="playlist-player-center"><div class="playlist-mode-control"><button id="playerMode" type="button" aria-label="列表循环" aria-expanded="false"><svg id="playerModeIcon" class="ui-icon player-mode-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use id="playerModeUse" href="#icon-mode-list"></use></svg></button><div id="playerModeMenu" class="playlist-mode-menu" role="menu" hidden><button type="button" role="menuitemradio" data-player-mode="shuffle"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-mode-shuffle"></use></svg><span>随机播放</span></button><button type="button" role="menuitemradio" data-player-mode="sequential"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-mode-sequential"></use></svg><span>顺序播放</span></button><button type="button" role="menuitemradio" data-player-mode="single"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-mode-single"></use></svg><span>单曲循环</span></button><button type="button" role="menuitemradio" data-player-mode="list"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-mode-list"></use></svg><span>列表循环</span></button></div></div><span id="playerQueue" class="playlist-player-queue">0 / 0</span><div class="playlist-player-buttons"><button id="playerPrevious" type="button" aria-label="上一首"><svg class="ui-icon player-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6z"/></svg></button><button id="playerToggle" class="playlist-player-toggle" type="button" aria-label="播放" data-state="paused"><svg class="ui-icon ui-icon--fill player-icon player-icon-play" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="ui-icon ui-icon--fill player-icon player-icon-pause" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM14 5h4v14h-4z"/></svg></button><button id="playerNext" type="button" aria-label="下一首"><svg class="ui-icon player-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6z"/></svg></button></div><div class="playlist-volume-control"><button id="playerMute" type="button" aria-label="静音" title="静音"><svg class="ui-icon player-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="player-icon-mute-waves" d="M16 9c1 .8 1.5 1.8 1.5 3S17 14.2 16 15"/><path class="player-icon-mute-cross" d="M16 8l5 8M21 8l-5 8"/></svg></button><div class="playlist-volume-panel"><input id="playerVolume" type="range" min="0" max="1" step="0.05" value="1" aria-label="音量"></div></div></div>
   <div class="playlist-player-tools"><span class="playlist-player-time"><span id="playerCurrent">0:00</span><span aria-hidden="true">/</span><span id="playerDuration">0:00</span></span></div>
  </div>
  <audio id="playerAudio" preload="none"></audio>
 </footer>
</div>
</body>
</html>
