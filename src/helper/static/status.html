<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曲库有序 · 运行状态</title><script src="/static/appearance.js?v=2.0.5"></script><link rel="stylesheet" href="/static/product.css?v=2.0.5"><script defer src="/static/auth.js?v=2.0.5"></script><script defer src="/static/status.js?v=2.0.5"></script></head><body data-view="status" data-auth-state="checking">
<div id="bootScreen" class="auth-boot"><div class="boot-mark">♫</div><strong>曲库有序</strong><span>正在进入你的音乐库…</span></div>
<section id="authShell" class="auth-shell" hidden>
 <div class="auth-card">
  <div class="auth-brand"><span class="brand-mark">♫</span><div><strong>曲库有序</strong><small>本地 Plex 音乐助手</small></div></div>
  <div id="loginPanel"><span class="eyebrow">WELCOME BACK</span><h1>登录</h1><form id="loginForm" class="auth-form"><label>用户名<input id="loginUser" autocomplete="username" value="admin" required></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form></div>
  <div id="setupPanel" hidden><span class="eyebrow">FIRST SETUP</span><h1>创建管理员账户</h1><form id="setupForm" class="auth-form"><label>用户名<input id="setupUser" autocomplete="username" value="admin" required></label><label>新密码<input id="setupPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>确认密码<input id="setupConfirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary" type="submit">建立账户并进入</button></form></div>
  <p id="authMessage" class="auth-message" hidden></p>
 </div>
</section>
<div id="workspace" hidden><header class="topbar"><a class="brand" href="/"><span class="brand-mark">♫</span><span>曲库有序<small id="version">v2.0.5</small></span></a><nav><a href="/">我的歌单</a><a class="active" href="/status">运行状态</a><a href="/settings">设置</a></nav><button class="logout" data-auth-logout hidden>退出</button></header><main class="wrap status-shell"><div id="notice" class="notice" hidden></div><section class="hero status-page-head"><div><h1>运行状态</h1></div><button id="refresh" class="secondary">刷新</button></section>
<section class="health-grid"><article class="card health-card"><span class="health-icon">P</span><div><small>Plex</small><strong id="plexHealth">检查中</strong></div></article><article class="card health-card"><span class="health-icon">Q</span><div><small>QQ 音乐</small><strong id="qqHealth">检查中</strong></div></article><article class="card health-card"><span class="health-icon">↻</span><div><small>后台任务</small><strong id="jobHealth">空闲</strong></div></article></section>
<section class="grid status-primary"><article class="card span-6"><div class="panel-title"><h2>播放学习</h2><span id="behaviorConnection" class="status-chip">检查中</span></div><div class="stats"><div class="stat"><span>已学习</span><strong id="behaviorLearned">0</strong></div><div class="stat"><span>偏好歌曲</span><strong id="behaviorPreferred">0</strong></div><div class="stat"><span>冷却中</span><strong id="behaviorCooled">0</strong></div><div class="stat"><span>当前播放</span><strong id="behaviorActive">0</strong></div></div><div class="status-meta"><span>最近活动</span><strong id="behaviorStatus">—</strong></div></article><article class="card span-6"><div class="panel-title"><h2>助手管理</h2></div><div class="status-list"><div><span>分类歌单</span><strong id="managedCount">0</strong></div><div><span>每日推荐</span><strong id="dailyManaged">未建立</strong></div><div><span>最近任务完成</span><strong id="lastRun">—</strong></div></div></article></section>
<details id="statusDetails" class="card page-disclosure"><summary><strong>运行详情</strong><span>连接与推荐统计</span></summary><div class="page-disclosure-body status-detail-grid"><div class="detail-row"><span>Plex</span><strong id="plexDetail">—</strong></div><div class="detail-row"><span>QQ 音乐</span><strong id="qqDetail">—</strong></div><div class="detail-row"><span>后台任务</span><strong id="jobDetail">—</strong></div><div class="detail-row detail-wide daily-diagnostics-row"><span>最近推荐</span><div class="daily-diagnostics"><strong id="dailyDiagnostics">尚未生成</strong><span id="dailyBuckets"></span><span id="dailySimilarity"></span><details id="dailyExclusionDetails" class="daily-exclusions" hidden><summary>查看排除</summary><span id="dailyExclusions"></span></details></div></div></div></details>
<details id="eventHistory" class="card page-disclosure"><summary><strong>运行记录</strong><span>最近 20 条</span></summary><div class="page-disclosure-body"><div id="events" class="event-list"></div></div></details></main></div></body></html>
