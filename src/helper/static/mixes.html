<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曲库有序 · 智能歌单</title><link rel="stylesheet" href="/static/product.css?v=1.1.7"><script defer src="/static/auth.js?v=1.1.7"></script><script defer src="/static/mixes.js?v=1.1.7"></script></head><body data-view="mixes" data-auth-state="checking">
<div id="bootScreen" class="auth-boot"><div class="boot-mark">♫</div><strong>曲库有序</strong><span>正在进入你的音乐库…</span></div>
<section id="authShell" class="auth-shell" hidden><div class="auth-card"><div class="auth-brand"><span class="brand-mark">♫</span><div><strong>曲库有序</strong><small>本地 Plex 音乐助手</small></div></div><div id="loginPanel"><span class="eyebrow">WELCOME BACK</span><h1>登录</h1><form id="loginForm" class="auth-form"><label>用户名<input id="loginUser" autocomplete="username" value="admin" required></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form></div><div id="setupPanel" hidden><span class="eyebrow">FIRST SETUP</span><h1>创建管理员账户</h1><form id="setupForm" class="auth-form"><label>用户名<input id="setupUser" autocomplete="username" value="admin" required></label><label>新密码<input id="setupPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>确认密码<input id="setupConfirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary" type="submit">建立账户并进入</button></form></div><p id="authMessage" class="auth-message" hidden></p></div></section>
<div id="workspace" hidden><header class="topbar"><a class="brand" href="/"><span class="brand-mark">♫</span><span>曲库有序<small id="version">v1.1.7</small></span></a><nav><a href="/">每日推荐</a><a class="active" href="/mixes">智能歌单</a><a href="/library">曲库整理</a><a href="/status">运行状态</a><a href="/settings">设置</a></nav><button class="logout" data-auth-logout hidden>退出</button></header>
<main class="wrap mixes-shell"><div id="notice" class="notice" hidden></div>
 <section class="mixes-head"><div><h1>智能歌单</h1><p>三种常用歌单，一处管理。</p></div></section>
 <section class="mix-list" aria-label="内置智能歌单">
  <article class="mix-row" data-kind="weekly" data-auto="weekly"><div class="mix-row-head"><div class="mix-identity"><span class="mix-icon">↻</span><div><h2>每周常听</h2><p>最近真正听过的歌手与歌曲</p></div></div><div class="mix-controls"><span class="mix-state">待发布</span><div class="mix-actions"><button class="secondary preview-mix">查看</button><button class="primary publish-mix" disabled>发布</button><button class="secondary adjust-mix">调整</button><button class="danger remove-mix" disabled>删除</button></div></div></div><div class="mix-drawer" hidden><section class="mix-preview-panel" hidden><div class="mix-panel-head"><div><strong>歌单预览</strong><span class="mix-preview-summary"></span></div><button class="mix-refresh regenerate-mix" type="button" aria-label="刷新预览" title="刷新预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"></path><path d="M20 4v7h-7"></path></svg></button></div><div class="mix-result"></div></section><section class="mix-adjust" hidden><div class="mix-panel-head"><strong>歌单设置</strong><button class="secondary close-adjust-panel">完成</button></div><div class="mix-options"><label>歌曲数<input name="size" type="number" min="10" max="100" value="30"></label><label>统计天数<input name="recent_days" type="number" min="7" max="90" value="30"></label></div></section></div></article>
  <article class="mix-row" data-kind="time_capsule" data-auto="weekly"><div class="mix-row-head"><div class="mix-identity"><span class="mix-icon">◷</span><div><h2>时光胶囊</h2><p>曾经听过、最近很久没播放</p></div></div><div class="mix-controls"><span class="mix-state">待发布</span><div class="mix-actions"><button class="secondary preview-mix">查看</button><button class="primary publish-mix" disabled>发布</button><button class="secondary adjust-mix">调整</button><button class="danger remove-mix" disabled>删除</button></div></div></div><div class="mix-drawer" hidden><section class="mix-preview-panel" hidden><div class="mix-panel-head"><div><strong>歌单预览</strong><span class="mix-preview-summary"></span></div><button class="mix-refresh regenerate-mix" type="button" aria-label="刷新预览" title="刷新预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"></path><path d="M20 4v7h-7"></path></svg></button></div><div class="mix-result"></div></section><section class="mix-adjust" hidden><div class="mix-panel-head"><strong>歌单设置</strong><button class="secondary close-adjust-panel">完成</button></div><div class="mix-options"><label>歌曲数<input name="size" type="number" min="10" max="100" value="30"></label><label>至少未听天数<input name="stale_days" type="number" min="30" max="3650" value="180"></label></div></section></div></article>
  <article class="mix-row" data-kind="recent_additions" data-auto="weekly"><div class="mix-row-head"><div class="mix-identity"><span class="mix-icon">＋</span><div><h2>最近新增</h2><p>刚进入曲库、还没充分探索</p></div></div><div class="mix-controls"><span class="mix-state">待发布</span><div class="mix-actions"><button class="secondary preview-mix">查看</button><button class="primary publish-mix" disabled>发布</button><button class="secondary adjust-mix">调整</button><button class="danger remove-mix" disabled>删除</button></div></div></div><div class="mix-drawer" hidden><section class="mix-preview-panel" hidden><div class="mix-panel-head"><div><strong>歌单预览</strong><span class="mix-preview-summary"></span></div><button class="mix-refresh regenerate-mix" type="button" aria-label="刷新预览" title="刷新预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"></path><path d="M20 4v7h-7"></path></svg></button></div><div class="mix-result"></div></section><section class="mix-adjust" hidden><div class="mix-panel-head"><strong>歌单设置</strong><button class="secondary close-adjust-panel">完成</button></div><div class="mix-options"><label>歌曲数<input name="size" type="number" min="10" max="100" value="30"></label><label>入库天数<input name="added_days" type="number" min="1" max="3650" value="90"></label></div></section></div></article>
 </section>
 <details class="custom-mix" data-kind="custom"><summary><span><strong>自定义精选</strong><small>按年代、类型、评分组合筛选</small></span><span>展开</span></summary><div class="custom-mix-body"><div class="mix-options custom"><label>歌曲数<input name="size" type="number" min="10" max="100" value="30"></label><label>起始年份<input name="year_min" type="number" min="1000" max="3000" placeholder="例如 1980"></label><label>结束年份<input name="year_max" type="number" min="1000" max="3000" placeholder="例如 2026"></label><label>类型 / 风格<input name="genres" placeholder="流行、摇滚"></label><label>最低评分<input name="min_rating" type="number" min="0" max="10" step="0.5" value="0"></label><label>最多播放次数<input name="max_play_count" type="number" min="0"></label><label>排序<select name="sort_by"><option value="random">稳定随机</option><option value="rating">评分优先</option><option value="play_count">播放次数</option><option value="added">最近入库</option><option value="last_played">最近播放</option></select></label></div><div class="mix-actions"><button class="secondary preview-mix">查看</button><button class="primary publish-mix" disabled>发布</button><button class="danger remove-mix" disabled>删除</button></div><span class="mix-state">待发布</span><div class="mix-drawer" hidden><section class="mix-preview-panel" hidden><div class="mix-panel-head"><div><strong>歌单预览</strong><span class="mix-preview-summary"></span></div><button class="mix-refresh regenerate-mix" type="button" aria-label="刷新预览" title="刷新预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"></path><path d="M20 4v7h-7"></path></svg></button></div><div class="mix-result"></div></section></div></div></details>
</main><footer class="footer">只维护本助手创建的歌单，不修改音乐文件</footer></div></body></html>
