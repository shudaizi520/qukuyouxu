<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>曲库有序 · 设置</title>
 <script src="/static/appearance.js?v=2.0.1"></script><link rel="stylesheet" href="/static/product.css?v=2.0.1">
 <script defer src="/static/auth.js?v=2.0.1"></script>
 <script defer src="/static/settings.js?v=2.0.1"></script>
</head>
<body data-view="settings" data-auth-state="checking">
<div id="bootScreen" class="auth-boot"><div class="boot-mark">♫</div><strong>曲库有序</strong><span>正在进入你的音乐库…</span></div>
<section id="authShell" class="auth-shell" hidden>
 <div class="auth-card">
  <div class="auth-brand"><span class="brand-mark">♫</span><div><strong>曲库有序</strong><small>本地 Plex 音乐助手</small></div></div>
  <div id="loginPanel"><span class="eyebrow">WELCOME BACK</span><h1>登录</h1><form id="loginForm" class="auth-form"><label>用户名<input id="loginUser" autocomplete="username" value="admin" required></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form></div>
  <div id="setupPanel" hidden><span class="eyebrow">FIRST SETUP</span><h1>创建管理员账户</h1><form id="setupForm" class="auth-form"><label>用户名<input id="setupUser" autocomplete="username" value="admin" required></label><label>新密码<input id="setupPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>确认密码<input id="setupConfirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary" type="submit">建立账户并进入</button></form></div>
  <p id="authMessage" class="auth-message" hidden></p>
 </div>
</section>

<div id="workspace" hidden>
 <header class="topbar">
  <a class="brand" href="/" target="_top"><span class="brand-mark">♫</span><span>曲库有序<small id="version">v2.0.1</small></span></a>
  <nav><a href="/" target="_top">我的歌单</a><a href="/status" target="_top">运行状态</a><a class="active" href="/settings" target="_top">设置</a></nav>
  <button class="logout" data-auth-logout hidden>退出</button>
 </header>

 <main class="settings-shell">
  <div id="notice" class="notice" hidden></div>
  <div class="settings-workspace">
   <section id="settings-accounts" class="settings-panel">
    <section id="currentUser" class="settings-section">
     <div class="settings-section-title"><h3>Plex 连接</h3><span id="plexState" class="connection-state">未检测</span><div class="settings-actions"><button class="primary compact-button" type="button" id="connectPlex">连接 Plex</button><button class="danger compact-button" type="button" id="disconnectPlex" hidden>断开 Plex</button></div></div>
     <div id="plexSavedSummary" class="connection-summary" hidden>
      <span><b id="savedAccount">Plex 账户</b></span><span><b id="savedServer">Plex 服务器</b></span><span><b id="savedLibrary">尚未选择</b></span>
     </div>
     <div id="plexLibraryPanel" class="settings-row account-selector-row account-library-row" hidden><label for="officialSection">首次连接的音乐库</label><select id="officialSection"></select><button class="primary" type="button" id="savePlexLibrary" hidden>保存</button></div>
     <details id="plexConnectionTools" class="connection-tools-inline" hidden><summary>连接选项<span id="plexConnectionLabel" hidden></span></summary><div class="settings-expander-body">
     <p id="plexLoginStatus" class="inline-status" aria-live="polite" hidden></p><button id="showManualFallback" class="secondary" type="button">手动连接 Plex</button>
     <div id="plexServerPanel" class="plex-server-panel" hidden><label for="plexServer">Plex 服务器</label><select id="plexServer"></select><button class="primary" type="button" id="usePlexServer">使用</button></div>
     <div id="manualFallback" hidden><details id="advancedPlex" class="advanced-connection"><summary>手动地址 / Token</summary><form id="plexForm" class="form-grid"><div class="field full"><label for="plexUrl">Plex 地址</label><input id="plexUrl" placeholder="http://192.168.x.x:32400"></div><div class="field"><label for="plexToken">Plex Token</label><input id="plexToken" type="password" autocomplete="off"><small id="tokenHint"></small></div><div class="field"><label for="section">音乐资料库</label><select id="section"><option value="">正在读取…</option></select><small id="sectionHint"></small></div><div class="field"><label for="accountLabel">账户备注</label><input id="accountLabel"></div><div class="field full actions"><button class="secondary" type="button" id="testPlex">测试连接</button><button class="primary" type="submit">保存连接</button></div></form></details></div>
     </div></details>
    </section>

    <section id="people" class="settings-section">
     <div class="settings-section-title"><h3>用户管理</h3><button class="primary compact-button" type="button" id="openAddUser">添加用户</button></div>
     <div class="settings-user-header" aria-hidden="true"><span>用户 · 音乐库</span><span>播放学习</span><span>每日推荐</span><span>智能歌单</span><span>操作</span></div>
     <div id="managedUserList" class="settings-user-list" aria-live="polite"></div>
     <div id="webhookTools" class="profile-webhook-tools"><div class="settings-section-title"><h3>Plex 播放事件</h3><span id="webhookMessage" aria-live="polite">正在检查</span></div><div class="webhook-setup-action"><code id="webhookUrl" aria-label="Plex Webhook 地址"></code><span class="webhook-action-buttons"><button id="copyWebhook" class="secondary" type="button">复制地址</button><a id="openPlexWebhooks" class="secondary button" href="https://app.plex.tv/desktop/#!/settings/webhooks" target="_blank" rel="noopener noreferrer">打开 Webhook</a></span></div><p id="webhookLast" class="settings-status-line"></p></div>
    </section>
   </section>

   <section id="settings-automation" class="settings-panel">
    <div class="settings-page-head"><h2>自动任务</h2></div>
    <section class="settings-section automation-list">
     <div id="dailyAutomation" class="automation-row"><strong>每日推荐时间</strong><div class="automation-controls"><span>每天</span><select id="dailyAutomationHour" class="automation-hour" aria-label="每日推荐执行时间"></select></div></div>
     <div id="smartAutomation" class="automation-row"><strong>智能歌单周期</strong><div class="automation-controls"><select id="smartIntervalDays" aria-label="智能歌单更新周期"><option value="1">每 1 天</option><option value="3">每 3 天</option><option value="5">每 5 天</option><option value="7">每 7 天</option><option value="10">每 10 天</option><option value="14">每 14 天</option><option value="20">每 20 天</option></select><select id="smartAutomationHour" class="automation-hour" aria-label="智能歌单执行时间"></select></div></div>
     <div id="libraryAutomation" class="automation-row"><strong>主账户新增歌曲整理</strong><div class="automation-controls"><span>每天</span><select id="libraryAutomationHour" class="automation-hour" aria-label="新增歌曲整理执行时间"></select><input id="libraryAutomationEnabled" class="toggle" type="checkbox" aria-label="启用主账户新增歌曲整理"></div></div>
    </section>
   </section>

   <section id="settings-system" class="settings-panel">
    <h2 class="sr-only">系统</h2>
    <details id="passwordTools" class="settings-section settings-expander"><summary><span>登录密码</span><span id="accountName">admin</span></summary><div class="settings-expander-body"><form id="passwordForm" class="form-grid"><div class="field"><label for="currentPassword">当前密码</label><input id="currentPassword" type="password" autocomplete="current-password"></div><div class="field"><label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label for="confirmPassword">确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"></div><div class="field full"><button class="primary" type="submit">修改密码</button></div></form></div></details>
   </section>
  </div>
 </main>

 <dialog id="addUserDialog" class="settings-dialog">
  <div class="settings-dialog-head"><h2>添加 Plex 用户</h2><button id="closeAddUser" class="secondary" type="button">关闭</button></div>
  <div id="profileRecipientList" class="settings-user-list dialog-user-list" aria-live="polite"></div>
  <div id="profileRecipientLibraries" class="recipient-library-list" aria-live="polite" hidden></div>
  <div class="settings-dialog-footer"><button class="secondary" type="button" id="findPeople">刷新名单</button></div>
  <details id="profileManager" class="dialog-independent"><summary>连接独立 Plex 账户</summary><div class="profile-manager-body"><form id="createProfile" class="profile-create"><label for="newProfileName">账户名称</label><input id="newProfileName" maxlength="80"><button class="secondary" type="submit">建立并授权</button></form></div></details>
 </dialog>
</div>
</body>
</html>
