<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="color-scheme" content="light">
 <title>曲库有序 · 外部歌单</title>
 <link rel="stylesheet" href="/static/product.css?v=1.4.3">
 <script defer src="/static/auth.js?v=1.4.3"></script>
 <script defer src="/static/external.js?v=1.4.3"></script>
</head>
<body data-view="external" data-auth-state="checking">
<div id="bootScreen" class="auth-boot"><div class="boot-mark">♫</div><strong>曲库有序</strong><span>正在进入你的音乐库…</span></div>
<section id="authShell" class="auth-shell" hidden>
 <div class="auth-card">
  <div class="auth-brand"><span class="brand-mark">♫</span><div><strong>曲库有序</strong><small>本地 Plex 音乐助手</small></div></div>
  <div id="loginPanel"><span class="eyebrow">WELCOME BACK</span><h1>登录</h1><form id="loginForm" class="auth-form"><label>用户名<input id="loginUser" autocomplete="username" value="admin" required></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form></div>
  <div id="setupPanel" hidden><span class="eyebrow">FIRST SETUP</span><h1>创建管理员账户</h1><form id="setupForm" class="auth-form"><label>用户名<input id="setupUser" autocomplete="username" value="admin" required></label><label>新密码<input id="setupPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>确认密码<input id="setupConfirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary" type="submit">建立账户并进入</button></form></div>
  <p id="authMessage" class="auth-message" hidden></p>
 </div>
</section>
<div id="workspace" hidden>
 <header class="topbar"><a class="brand" href="/"><span class="brand-mark">♫</span><span>曲库有序<small id="version">v1.4.3</small></span></a><nav><a href="/">我的歌单</a><a href="/status">运行状态</a><a href="/settings">设置</a></nav><button class="logout" data-auth-logout hidden>退出</button></header>
 <main class="wrap external-shell">
  <div id="notice" class="notice" role="status" hidden></div>
  <section class="hero external-page-title"><div><h1>外部歌单</h1><p>导入公开歌单，与自己的 Plex 曲库快速核对。</p></div></section>

  <section id="importCard" class="card external-import-card">
   <div class="panel-title"><h2>导入歌单</h2><span class="external-import-hint">QQ 音乐、网易云音乐或本地歌单文件</span></div>
   <form id="importForm" class="external-import-form">
    <label class="field external-url-field" for="sourceUrl"><span>公开歌单链接</span><input id="sourceUrl" type="url" inputmode="url" autocomplete="off" placeholder="粘贴 QQ 音乐或网易云音乐公开歌单链接"></label>
    <button id="importSource" class="primary" type="submit">导入并分析</button>
    <label class="secondary button external-file-action" for="sourceFile">选择歌单文件<input id="sourceFile" type="file" accept=".m3u,.m3u8,.txt,.csv,text/plain,text/csv,audio/x-mpegurl" hidden></label>
   </form>
   <span id="selectedFile" class="external-file-name">支持 QQ 音乐、网易云音乐、M3U、TXT 和 CSV</span>
  </section>

  <section id="sourceWorkspace" class="external-workspace" hidden>
   <aside class="external-source-panel external-source-strip" aria-label="已导入歌单">
    <div class="panel-title"><h2>已导入</h2><button id="reloadSources" class="secondary compact-button" type="button">刷新</button></div>
    <div id="sourceList" class="external-source-list"></div>
   </aside>

   <div class="external-detail-stack">
    <section id="detailCard" class="card external-detail-card">
     <div class="external-detail-head"><div><span id="sourceProvider" class="eyebrow"></span><h2 id="sourceTitle">歌单</h2><span id="sourceState" class="external-state"></span></div><div class="actions"><button id="refreshSource" class="secondary" type="button">重新读取</button><button id="removeSource" class="danger" type="button">移除</button></div></div>
     <div class="external-counts" aria-label="匹配结果">
      <button class="external-count-tab active" type="button" data-match-status="matched"><span>已匹配</span><strong id="matchedCount">0</strong></button>
      <button class="external-count-tab" type="button" data-match-status="review"><span>待确认</span><strong id="reviewCount">0</strong></button>
      <button class="external-count-tab" type="button" data-match-status="missing"><span>缺失歌曲</span><strong id="missingCount">0</strong></button>
     </div>
     <div id="trackList" class="external-track-list" aria-live="polite"></div>
     <div id="trackPaging" class="external-paging"><button id="previousTracks" class="secondary" type="button">上一页</button><span id="trackRange"></span><button id="nextTracks" class="secondary" type="button">下一页</button></div>
     <audio id="auditionPlayer" preload="none" hidden></audio>
    </section>

    <section id="publishCard" class="card external-publish-card">
     <div><h2>创建 Plex 歌单</h2></div>
     <label class="field external-title-field" for="plexPlaylistTitle"><span>Plex 歌单名称</span><input id="plexPlaylistTitle" maxlength="80"></label>
     <div class="external-publish-actions"><label id="followUpdatesRow" class="external-follow-label"><input id="followUpdates" type="checkbox">曲库整理时自动刷新</label><button id="publishSource" class="primary" type="button">创建歌单（0首）</button></div>
    </section>

    <section id="replenishmentCard" class="card external-replenishment" hidden>
     <div class="panel-title"><h2>缺失歌曲</h2></div>
     <div class="actions"><button id="copyMissing" class="primary" type="button">复制歌单内容</button><button id="downloadImage" class="secondary" type="button">下载歌单长图</button><details class="external-more"><summary class="secondary button">更多格式</summary><div><a id="downloadText" class="link" href="#">下载 TXT</a><a id="downloadCsv" class="link" href="#">下载 CSV</a></div></details></div>
     <div class="external-share-row"><button id="copyShareLink" class="secondary" type="button">复制清单页面链接</button></div>
    </section>
   </div>
  </section>
 </main>
</div>
</body>
</html>
