<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="app-version" content="2.0.7">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="color-scheme" content="light dark">
 <title>曲库有序 · 外部歌单</title>
 <script src="/static/appearance.js?v=app"></script><link rel="stylesheet" href="/static/product.css?v=app"><link rel="stylesheet" href="/static/external-workspace.css?v=app"><link rel="stylesheet" href="/static/theme-tokens.css?v=app"><link rel="stylesheet" href="/static/theme-background.css?v=app"><link rel="stylesheet" href="/static/ui-components.css?v=app"><link rel="stylesheet" href="/static/design-system.css?v=app"><link rel="stylesheet" href="/static/management-shell.css?v=app">
 <script defer src="/static/auth.js?v=app"></script>
 <script defer src="/static/management-shell.js?v=app"></script>
 <script type="module" src="/static/external.js?v=app"></script>
</head>
<body data-view="external" data-management-page="external" data-auth-state="checking">
<div id="bootScreen" class="auth-boot"><div class="boot-mark">♫</div><strong>曲库有序</strong><span>正在进入你的音乐库…</span></div>
<section id="authShell" class="auth-shell" hidden>
 <div class="auth-card">
  <div class="auth-brand"><span class="brand-mark">♫</span><div><strong>曲库有序</strong><small>本地 Plex 音乐助手</small></div></div>
  <div id="loginPanel"><span class="eyebrow">WELCOME BACK</span><h1>登录</h1><form id="loginForm" class="auth-form"><label>用户名<input id="loginUser" autocomplete="username" value="admin" required></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form></div>
  <div id="setupPanel" hidden><span class="eyebrow">FIRST SETUP</span><h1>创建管理员账户</h1><form id="setupForm" class="auth-form"><label>用户名<input id="setupUser" autocomplete="username" value="admin" required></label><label>新密码<input id="setupPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>确认密码<input id="setupConfirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary" type="submit">建立账户并进入</button></form></div>
  <p id="authMessage" class="auth-message" hidden></p>
 </div>
</section>
<div id="workspace" hidden>
 <header class="topbar"><a class="brand" href="/"><span class="brand-mark">♫</span><span>曲库有序</span></a><nav><a href="/">我的歌单</a><a href="/status">运行状态</a><a href="/settings">设置</a></nav><button class="logout" data-auth-logout hidden>退出</button></header>
 <main class="wrap external-shell" data-management-shell>
  <div id="notice" class="notice" role="status" hidden></div>
  <section id="importCard" class="external-import-card management-section">
   <form id="importForm" class="external-import-form">
    <label class="field external-url-field" for="sourceUrl"><span>歌单链接</span><input id="sourceUrl" type="url" inputmode="url" autocomplete="off" placeholder="粘贴链接"></label>
    <div class="external-command-actions"><label class="external-file-action" for="sourceFile">选择文件<input id="sourceFile" type="file" accept=".m3u,.m3u8,.txt,.csv,text/plain,text/csv,audio/x-mpegurl" hidden></label><button id="importSource" class="primary" type="submit">开始导入</button></div>
   </form>
   <span id="selectedFile" class="external-file-name" hidden></span>
  </section>

  <section id="sourceWorkspace" class="external-workspace" hidden>
   <div class="external-settings management-section">
   <section class="external-command-bar" aria-label="已导入歌单">
    <label for="sourceSelector">已导入</label><select id="sourceSelector" aria-label="切换已导入歌单"></select><div class="external-command-actions"><button id="refreshSource" class="external-text-action" type="button">重新读取</button><button id="removeSource" class="external-text-action danger-text" type="button">移除来源</button></div>
   </section>
   <section class="external-command-bar" aria-label="Plex 歌单设置">
    <label for="plexPlaylistTitle">Plex 歌单</label><div class="external-command-main"><input id="plexPlaylistTitle" maxlength="80" aria-label="Plex 歌单名称"><span id="sourceState" class="external-state"></span></div>
    <div class="external-command-actions"><label id="followUpdatesRow" class="external-follow-label"><input id="followUpdates" type="checkbox">自动刷新</label><button id="publishSource" class="primary" type="button">更新歌单</button></div>
   </section>
   </div>
   <section id="detailCard" class="external-detail-card management-section">
     <div class="external-counts" aria-label="匹配结果">
      <button class="external-count-tab active" type="button" data-match-status="matched"><span>已匹配</span><strong id="matchedCount">0</strong></button>
      <button class="external-count-tab" type="button" data-match-status="review"><span>待确认</span><strong id="reviewCount">0</strong></button>
      <button class="external-count-tab" type="button" data-match-status="missing"><span>缺失歌曲</span><strong id="missingCount">0</strong></button>
      <span id="replenishmentCard" class="external-missing-download" hidden>
       <button id="copyMissing" class="external-text-action" type="button">复制清单</button>
       <details id="downloadMenu" class="external-more"><summary class="external-text-action">下载缺失歌曲</summary><div><a id="downloadText" class="link" href="#">TXT</a><a id="downloadCsv" class="link" href="#">CSV</a><button id="downloadImage" class="external-text-action" type="button">长图</button></div></details>
      </span>
     </div>
     <div id="reviewToolbar" class="external-review-toolbar" hidden><label><input id="reviewSelectAll" type="checkbox">全选本页</label><span id="reviewSelectedCount">已选 0 首</span><button id="confirmSelected" class="primary" type="button" disabled>确认所选</button></div>
     <div id="trackColumnHead" class="external-track-column-head"><span aria-hidden="true"></span><span>歌曲</span><span>歌手</span><span>专辑</span><span>时长</span><span id="trackReviewHeading" hidden>匹配</span></div>
     <div id="trackList" class="external-track-list" aria-live="polite"></div>
     <div id="trackPaging" class="external-paging"><button id="previousTracks" class="secondary" type="button">上一页</button><span id="trackRange"></span><button id="nextTracks" class="secondary" type="button">下一页</button></div>
   </section>
  </section>
 </main>
</div>
</body>
</html>
