name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest==9.1.1
          python -m pip check
      - name: Repository hygiene
        run: python tools/check_repository.py
      - name: Compile
        run: python -m compileall -q src tools
      - name: Test
        run: python -m pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Settings interaction tests
        run: node tests/settings_interactions.test.js
      - name: Appearance menu tests
        run: node --test tests/appearance.test.js

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test container
        run: docker build -t qukuyouxu:release-smoke .
      - name: Check container health
        run: |
          docker run -d --name qukuyouxu-release-smoke qukuyouxu:release-smoke
          for attempt in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' qukuyouxu-release-smoke)"
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm -f qukuyouxu-release-smoke >/dev/null 2>&1 || true
